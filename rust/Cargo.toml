[package]
name = "codecity"
version = "1.0.0"
edition = "2021"
description = "Interactive 3D software city for Java, TypeScript and Rust code bases (native Rust port)"
license = "MIT"
default-run = "codecity"

[features]
default = ["gui"]
# Native desktop window (OpenGL via three-d + egui). Disable for a smaller, faster-to-build CLI.
gui = ["dep:three-d", "dep:webbrowser", "dep:winit"]

[dependencies]
tree-sitter = "=0.27.0"
tree-sitter-java = "=0.23.5"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.2"
rayon = "=1.12.0"
ignore = "=0.4.33"
serde_json = "=1.0.151"
tiny_http = "=0.12.0"
notify = "=8.2.0"
ureq = "=3.4.0"
regex = "1.11"
three-d = { version = "=0.19.0", optional = true, features = ["egui-gui", "window"] }
webbrowser = { version = "=1.2.3", optional = true }
# The windowing library three-d uses (same version, no extra crates). The desktop viewer drives winit's event loop
# itself, instead of three-d's `Window::render_loop`, to grab the cursor and read raw mouse motion in walk mode.
winit = { version = "=0.28.7", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
